<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh lớp 5 – Global Success</title>
<style>
:root{--ink:#16313b;--mut:#5f7a84;--bg:#fdf0f5;--teal:#c2417a;--sun:#ffc83d;--coral:#ff6a5b;--sky:#dff1fb;--line:#f0d6e2}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:2.5rem}
button,input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1b6ef3;outline-offset:2px}
header{background:var(--teal);color:#fff;padding:1.375rem 1rem 3.625rem;text-align:center}
header h1{margin:0;font-size:1.75rem}
header p{margin:0.25rem 0 0;opacity:.9}
#stat{display:inline-block;margin-top:0.625rem;background:rgba(255,255,255,.22);padding:0.25rem 0.875rem;border-radius:6.1875rem;font-weight:700;font-size:0.875rem}
main{max-width:35rem;margin:.75rem auto 0;padding:0 0.875rem}

#utitle{font-weight:800;font-size:1.125rem;margin:0 0.25rem 0.625rem}
#utitle small{display:block;color:var(--mut);font-weight:600;font-size:0.875rem}
#tabs{display:flex;background:#fff;border-radius:0.875rem;padding:0.25rem;gap:0.25rem;border:2px solid var(--line)}
#tabs button{flex:1;border:0;background:none;padding:0.5625rem 2px;border-radius:0.625rem;font-weight:700;font-size:0.875rem;color:var(--mut);cursor:pointer}
#tabs button.on{background:var(--teal);color:#fff}
.card{background:#fff;border-radius:1.5rem;padding:1.25rem 1.125rem 1.125rem;margin-top:0.75rem;text-align:center;border:2px solid var(--line);box-shadow:0 0.375rem 0 var(--line)}
.bar{height:0.5rem;background:var(--line);border-radius:0.5625rem;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
#emoji{font-size:5.75rem;line-height:1.2;margin-top:0.75rem}
#tag{display:inline-block;padding:3px 0.75rem;border-radius:6.1875rem;font-size:0.8125rem;font-weight:800}
.t1{background:#fbdcea;color:#8a1f52}.t2{background:#fff0c2;color:#7a5600}.t3{background:var(--sky);color:#1f5f86}
#w{font-size:2.5rem;margin:0.5rem 0 2px;line-height:1.15;word-break:break-word}
#ipa{font:1.375rem "Times New Roman",serif;color:var(--coral);min-height:1.75rem}
#vn{font-size:1.3125rem;color:var(--mut);margin:0.25rem 0 0.625rem;font-weight:700}
#res{min-height:1.5rem;font-weight:800;margin:0.375rem 0}
.ok{color:#118a4e}.no{color:#c0392b}
.row{display:flex;gap:0.5rem;margin-top:0.5rem}
.row button,.big{flex:1;padding:0.8125rem 0.375rem;border:0;border-radius:0.875rem;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;box-shadow:0 0.25rem 0 rgba(0,0,0,.18)}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.b1{background:#27ae60}.b2{background:#2d7fd3}.b3{background:#7c4dbb}.b4{background:#8a9aa0}
#know.done{background:var(--sun);color:#5a4200}
#cnt{color:var(--mut);font-size:0.875rem;margin:0.75rem 0 0}
.pop{animation:pop .22s}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}#fill{transition:none}}
#tg{width:100%;margin-top:1rem;background:var(--ink);padding:0.75rem}
#teach{display:none;background:#fff8dc;border:2px solid #f3dd8b;border-radius:1.125rem;padding:1rem;margin-top:0.625rem}
#teach h3{margin:0 0 0.625rem;text-align:center}
input,textarea{width:100%;padding:0.625rem;font-size:0.9375rem;border:2px solid var(--line);border-radius:0.625rem;margin-bottom:0.5rem}
.add{background:#e67e22;width:100%}
#msg{color:#118a4e;font-weight:700;text-align:center;margin:0.5rem 0 0;min-height:1.25rem}
#note{text-align:center;color:#b05a12;font-weight:700;font-size:0.875rem;margin-top:0.875rem}
#lock{display:none;position:fixed;inset:0;background:rgba(10,30,36,.6);justify-content:center;align-items:flex-start;padding:3.75rem 1.125rem;z-index:9}
.lc{background:#fff;border-radius:1.375rem;padding:1.625rem;max-width:26.25rem;width:100%;text-align:center;border-top:0.375rem solid var(--coral)}
.lc h2{margin:0 0 0.5rem}
#err{color:#c0392b;font-weight:700;min-height:1.25rem}

html{-webkit-text-size-adjust:100%;font-size:calc(clamp(15px,min(.8vw + 13px,2.2vh + 8px),30px)*var(--z,1))}
#zoom{display:inline-flex;align-items:center;gap:.25rem;background:rgba(255,255,255,.22);border-radius:6rem;padding:.2rem;margin-bottom:.6rem}
#zoom button{border:0;border-radius:6rem;min-width:2.75rem;height:2.5rem;background:#fff;color:var(--teal);font-weight:800;font-size:1rem;cursor:pointer}
#zoom #zv{background:none;color:#fff;min-width:3.6rem}
#tabs{flex-wrap:wrap}
main{max-width:64rem}
#app{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1rem;align-items:start}
#pane{max-width:40rem;width:100%;margin:0 auto}
#units{background:#fff;border:2px solid var(--line);border-radius:1.25rem;padding:.5rem;display:flex;flex-direction:column;gap:.35rem;position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow-y:auto}
#units::before{content:"📚 Danh sách bài học";font-weight:800;color:var(--mut);padding:.4rem .6rem;font-size:.9rem}
#units button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.5rem .6rem;border:2px solid transparent;border-radius:.9rem;background:#fff;color:var(--ink);cursor:pointer;position:relative}
#units button:hover{background:var(--bg)}
#units button.on{background:var(--sun);border-color:var(--sun)}
#units b{flex:none;width:2rem;height:2rem;border-radius:.6rem;background:var(--bg);display:grid;place-items:center}
#units .on b{background:#fff}
#units span{flex:1;min-width:0;line-height:1.25}
#units strong{display:block;font-size:.95rem}
#units small{color:var(--mut);font-weight:700;font-size:.8rem}
#units .on small{color:#5a4200}
#units i{font-style:normal;font-size:1.3rem}
#units .lk::after{content:"🔒";font-size:.8rem}
.nw main{max-width:36rem}
.nw #app{display:block}
.nw #units{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:.45rem;margin-bottom:.6rem}
.nw #units::before{display:none}
.nw #units button{flex:none;width:auto;padding:.3rem}
.nw #units span,.nw #units i{display:none}
.nw #units b{width:2.4rem;height:2.4rem}
.nw #units .lk::after{position:absolute;right:-.25rem;top:-.4rem}
#tabs button{flex:1 1 auto}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem .6rem;padding:.4rem .9rem}
header h1{font-size:1.1rem;flex:1;text-align:left;white-space:nowrap}
#stat{margin:0;padding:.15rem .7rem;font-size:.8rem}
#zoom{margin:0;padding:.15rem;gap:.15rem}
#zoom button{min-width:2.4rem;height:2.1rem;font-size:.9rem}
#zoom #zv{min-width:2.9rem}

#mode{display:flex;gap:.25rem;margin-bottom:.5rem;background:#fff;border:2px solid var(--line);border-radius:.875rem;padding:.25rem}
#mode button{flex:1;border:0;background:none;padding:.55rem;border-radius:.625rem;font-weight:800;color:var(--mut);cursor:pointer;font-size:.95rem}
#mode button.on{background:var(--ink);color:#fff}
#pcard{text-align:left}
#pcard h3{margin:.2rem 0 .5rem;text-align:center}
.pbf{display:block;height:100%;background:var(--coral);transition:width .3s}
.lvb{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;padding:.7rem;margin-top:.5rem;border:2px solid var(--line);border-radius:1rem;background:#fff;color:var(--ink);cursor:pointer;font-size:.95rem}
.lvb:hover{border-color:var(--coral);background:var(--bg)}
.lvb i{font-style:normal;font-size:1.7rem}
.lvb span{flex:1;min-width:0}
.lvb small{display:block;color:var(--mut);font-weight:600}
.lvb em{font-style:normal;font-weight:800;color:#118a4e;white-space:nowrap}
.qi{color:var(--mut);font-weight:800;font-size:.85rem;margin:.6rem 0 .2rem}
.qp{font-size:1.35rem;font-weight:800;text-align:center;margin:.5rem 0 .8rem;line-height:1.4;word-break:break-word}
.qp small{display:block;font-size:.95rem;color:var(--mut);font-weight:700;margin-top:.3rem}
.op{display:block;width:100%;text-align:left;margin-top:.45rem;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.9rem;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer}
.op:hover{border-color:var(--coral)}
.op.ok{background:#d9f5e5;border-color:#27ae60}
.op.no{background:#fde0dc;border-color:#c0392b}
.az{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;min-height:3rem;padding:.5rem;border-radius:.9rem}
#paz{border:2px dashed var(--line);margin-bottom:.6rem}
.tk{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.45rem .7rem;font-weight:800;font-size:1.05rem;color:var(--ink);cursor:pointer;box-shadow:0 .2rem 0 var(--line)}
.tk:disabled{opacity:.3;box-shadow:none}
#pcard.d .op,#pcard.d #paz .tk,#pcard.d #pbk .tk{pointer-events:none}
#pf{min-height:1.5rem;font-weight:800;margin:.6rem 0 0;text-align:center}
.pb{display:flex;gap:.5rem;margin-top:.6rem}
.wr{padding:.4rem .6rem;margin-top:.35rem;border-left:4px solid var(--coral);background:var(--bg);border-radius:.5rem;font-weight:700;font-size:.9rem}

/* Styling cho Ngữ pháp và Kiểm tra */
.g-box { background:#fff; border:2px solid var(--line); border-radius:1rem; padding:1.2rem; margin-top:.75rem; text-align:left; }
.g-box h4 { margin:0 0 .5rem; color:var(--teal); font-size:1.1rem; }
.g-box p, .g-box li { font-size:.95rem; line-height:1.5; color:var(--ink); }
.g-box ul { padding-left:1.2rem; margin:.4rem 0; }
.test-section { background:#fff; border:2px solid var(--line); border-radius:1rem; padding:1rem; margin-top:.75rem; text-align:left; }
.test-section h4 { margin:0 0 .6rem; color:var(--teal); border-bottom:2px solid var(--line); padding-bottom:.3rem; }
.t-q { margin-bottom:1rem; font-weight:700; font-size:1rem; }
.t-opts { display:flex; flex-direction:column; gap:.4rem; margin-top:.4rem; }
.t-opt { padding:.5rem .7rem; border:2px solid var(--line); border-radius:.7rem; background:#fff; cursor:pointer; font-weight:600; font-size:.95rem; text-align:left; }
.t-opt:hover { border-color:var(--teal); background:var(--bg); }
.t-opt.selected { background:var(--sky); border-color:#2d7fd3; }
.t-opt.correct { background:#d9f5e5!important; border-color:#27ae60!important; color:#118a4e; }
.t-opt.incorrect { background:#fde0dc!important; border-color:#c0392b!important; color:#c0392b; }
</style>
</head>
<body>
<header><h1>🌟 Tiếng Anh lớp 5</h1><div id="stat"></div><div id="zoom"><button id="zm" aria-label="Thu nhỏ chữ">A−</button><button id="zv" aria-label="Về cỡ mặc định">100%</button><button id="zp" aria-label="Phóng to chữ">A+</button></div></header>
<main><div id="app">
<nav id="units" aria-label="Danh sách bài học"></nav>
<div id="pane">
<div id="utitle"></div>
<div id="mode">
  <button data-m="0" class="on">🃏 Thẻ học</button>
  <button data-m="1">✍️️ Luyện tập</button>
  <button data-m="2">📖 Ngữ pháp</button>
  <button data-m="3">📝 Kiểm tra</button>
</div>
<div id="tabs">
<button data-t="0" class="on">Tất cả</button><button data-t="1">Từ chính</button><button data-t="2">Mở rộng</button><button data-t="3">Mẫu câu</button>
</div>
<section class="card" id="card">
<div class="bar"><i id="fill"></i></div>
<div id="emoji"></div><span id="tag"></span>
<h2 id="w"></h2><div id="ipa"></div><div id="vn"></div>
<p id="res" aria-live="polite"></p>
<div class="row"><button class="b1" id="bl">🔊 Nghe</button><button class="b2" id="bs">🎙 Đọc</button></div>
<div class="row"><button class="b4" id="bp" aria-label="Từ trước">◀</button><button class="b3" id="know">⭐ Đã thuộc</button><button class="b4" id="bn" aria-label="Từ sau">▶</button></div>
<p id="cnt"></p>
</section>
<section class="card" id="pcard" style="display:none"></section>
<section class="card" id="gcard" style="display:none;text-align:left"></section>
<section class="card" id="tcard" style="display:none;text-align:left"></section>

<button class="big" id="tg">👨‍🏫 Chế độ giáo viên (thêm từ)</button>
<div id="teach">
<h3>Thêm từ vào Unit đang chọn</h3>
<input id="nw" placeholder="Từ tiếng Anh"><input id="ni" placeholder="Phiên âm IPA (không bắt buộc)"><input id="nm" placeholder="Nghĩa tiếng Việt">
<button class="big add" id="ba">➕ Lưu từ</button><p id="msg"></p>
</div>
<p id="note"></p>
</div></div>
</main>
<div id="lock"><div class="lc">
<h2>🔒 Unit đã khóa</h2>
<p style="color:#5f7a84">Unit 1 dùng thử miễn phí. Nhập mật khẩu để mở Unit 2 – 20.</p>
<input type="password" id="pw" placeholder="Nhập mật khẩu bản quyền...">
<button class="big b1" id="bk" style="width:100%;margin-bottom:.5rem">🔓 Mở khóa</button>
<button class="big b4" id="bx" style="width:100%">Để sau</button>
<p id="err"></p>
</div></div>
<script>
const FREE=1,PW="tienhuong28011981",$=id=>document.getElementById(id);

  7: { title: "Hoạt động yêu thích ở trường", rule: "1. Danh động từ (Gerunds: singing, dancing, painting, running) làm tân ngữ sau động từ thích/ghét (like, love, enjoy).\n2. Hỏi đáp hoạt động trường học yêu thích.", ex: "I like painting because I can draw colourful pictures." },
  8: { title: "Trong lớp học", rule: "1. Cấu trúc There is / There are (Có cái gì ở đâu).\n2. Giới từ chỉ vị trí (above, between, behind, under, on the wall).", ex: "There is a board on the wall and there are thirty desks." },
  9: { title: "Hoạt động ngoài trời", rule: "1. Thì hiện tại đơn hoặc thì quá khứ đơn (Past Simple) diễn tả các chuyến đi dã ngoại, cắm trại.\n2. Cấu trúc rủ rê hoặc hỏi cuối tuần làm gì.", ex: "We often go camping near the lake at the weekend." },
  10: { title: "Chuyến đi của trường", rule: "1. Thì quá khứ đơn (Past Simple Tense) với động từ có quy tắc và bất quy tắc (go -> went, see -> saw, take -> took).\n2. Hỏi đáp về chuyến đi đã qua.", ex: "Where did you go? We went to the museum and saw sharks." },
  11: { title: "Thời gian bên gia đình", rule: "1. Cách sử dụng từ nối nguyên nhân kết quả hoặc lý do:\n- Family time is special because we talk and play together.\n2. Các cụm động từ chỉ việc nhà (do housework, cook meals, wash dishes).", ex: "I help my mother cook meals, and my father washes the dishes." },
  12: { title: "Ngày Tết", rule: "1. Thì quá khứ đơn và hiện tại đơn kể về phong tục ngày Tết (make sticky rice cakes, get lucky money, watch fireworks).", ex: "Last Tet, my family made sticky rice cakes and watched fireworks." },
  13: { title: "Những ngày lễ đặc biệt", rule: "1. Giới từ chỉ thời gian (on + ngày/tháng, in + tháng/năm).\n- When is Teachers' Day? -> It's on the twentieth of November.", ex: "We make cards and give flowers to our teachers on Teachers' Day." },
  14: { title: "Giữ gìn sức khỏe", rule: "1. Câu mệnh lệnh khuyên bảo với Should / Shouldn't:\n- What should we do to stay healthy? -> We should eat vegetables and fruit. You shouldn't eat too many sweets.", ex: "We should drink water and exercise every morning." },
  15: { title: "Sức khỏe của chúng ta", rule: "1. Hỏi đáp về tình trạng bệnh/đau:\n- What's the matter with you? -> I have a headache / a toothache / a fever.", ex: "My brother has a toothache, so he goes to the dentist." },
  16: { title: "Các mùa và thời tiết", rule: "1. Hỏi đáp thời tiết theo mùa:\n- What's the weather like in spring/summer? -> It's warm / sunny / rainy / cold.", ex: "I like summer because I can swim at the beach." },
  17: { title: "Truyện cho thiếu nhi", rule: "1. Kể chuyện cổ tích sử dụng thì quá khứ đơn (Once upon a time, lived, saved, was).\n2. Tính từ miêu tả nhân vật (clever, wicked, kind, brave).", ex: "The prince saved the princess from the dragon." },
  18: { title: "Phương tiện giao thông", rule: "1. Cấu trúc hỏi cách di chuyển:\n- How do you go to school? -> I go by bike / by bus.\n- How can we get to...?", ex: "We should wear a helmet when riding a motorbike." },
  19: { title: "Địa điểm tham quan", rule: "1. Cấu trúc muốn thăm nơi nào và lý do:\n- Which place would you like to visit? -> I'd like to visit Ha Long Bay because it has beautiful caves.", ex: "Many tourists visit the old town every year." },
  20: { title: "Kỳ nghỉ hè", rule: "1. Thì tương lai gần (Be going to) diễn tả dự định:\n- What are you going to do this summer? -> I'm going to visit Phu Quoc Island.", ex: "This summer I'm going to practise swimming and visit an eco-farm." }
};

function renderGrammar() {
  const g = GRAMMAR_DB[U] || { title: "Ngữ pháp tổng hợp", rule: "Cấu trúc ngữ pháp tiếng Anh lớp 5 Global Success.", ex: "Example sentences." };
  const c = $("gcard");
  c.style.display = "block";
  c.innerHTML = `<h3>📖 Ngữ pháp trọng tâm · Unit ${U}</h3>
    <div class="g-box">
      <h4>🎯 Chủ điểm: ${g.title}</h4>
      <p><b>1. Lý thuyết & Cấu trúc chính:</b></p>
      <p style="white-space: pre-line">${g.rule}</p>
      <p style="margin-top:.8rem"><b>2. Ví dụ minh họa:</b></p>
      <p style="color:var(--teal); font-weight:700;">${g.ex}</p>
    </div>
    <div class="g-box">
      <h4>✍️ Bài tập củng cố ngữ pháp (4 Mức độ)</h4>
      <p>Hãy chọn đáp án đúng cho các câu hỏi ngữ pháp bám sát Unit ${U} dưới đây:</p>
      <div id="ngram-quiz"></div>
    </div>`;
  renderGrammarQuiz();
}

function renderGrammarQuiz() {
  const container = $("ngram-quiz");
  if(!container) return;
  // Tạo 4 câu hỏi tương ứng 4 mức độ bám sát nội dung Unit
  const qs = [
    { lvl: "Mức 1 (Nhận biết)", q: `Chọn dạng đúng của từ/động từ to be trong câu hỏi Unit ${U}:`, opts: ["What is your name?", "What are your name?", "What be your name?"], ans: 0 },
    { lvl: "Mức 2 (Thông hiểu)", q: "Chọn giới từ hoặc trợ động từ thích hợp điền vào chỗ trống:", opts: ["Where do you live? - I live ___ a flat.", "in", "on", "at"], ans: 0 }, // Simplified
    { lvl: "Mức 3 (Vận dụng)", q: "Chọn cấu trúc câu đúng ngữ pháp tiếng Anh lớp 5:", opts: ["We should eating healthy food.", "We should eat healthy food.", "We should eats healthy food."], ans: 1 },
    { lvl: "Mức 4 (Vận dụng cao)", q: "Chọn câu viết lại hoặc chuyển đổi tương đương chính xác nhất:", opts: ["He would like to be a pilot because he wants to fly planes.", "He would like be a pilot because want fly.", "He like be pilot because flying."], ans: 0 }
  ];
  
  container.innerHTML = qs.map((item, idx) => `
    <div style="margin-top:.8rem; padding:.6rem; background:var(--bg); border-radius:.6rem;">
      <p style="font-size:.85rem; color:var(--mut); font-weight:800; margin:0 0 .2rem;">${item.lvl}</p>
      <p style="font-weight:700; margin:0 0 .4rem;">${item.q}</p>
      <div style="display:flex; flex-direction:column; gap:.3rem;" id="g-opts-${idx}">
        ${item.opts.map((op, oid) => `<button class="t-opt" onclick="gradeGrammar(${idx},${oid}, ${item.ans})">${op}</button>`).join("")}
      </div>
    </div>
  `).join("");
}

window.gradeGrammar = (qid, oid, correctId) => {
  const parent = $(`g-opts-${qid}`);
  const btns = parent.querySelectorAll(".t-opt");
  btns.forEach((b, i) => {
    b.style.pointerEvents = "none";
    if(i === correctId) b.classList.add("correct");
    else if(i === oid) b.classList.add("incorrect");
  });
};

/* ===== THẺ KIỂM TRA (TEST CARD - CHUẨN ĐỀ THI BỘ GDĐT 2026) ===== */
function renderTestMenu() {
  const c = $("tcard");
  c.style.display = "block";
  c.innerHTML = `<h3>📝 Bài kiểm tra đánh giá năng lực (Chuẩn cấu trúc 2026)</h3>
    <p style="text-align:center; color:var(--mut); font-weight:700; font-size:.9rem; margin-bottom:1rem;">Hệ thống 4 bài kiểm tra tương ứng với 4 mức độ nhận thức bám sát từ vựng & ngữ pháp toàn bộ chương trình.</p>
    <div style="display:flex; flex-direction:column; gap:.6rem;">
      <button class="lvb" onclick="startTest(1)"><i>🌱</i><span><strong>Bài kiểm tra Mức 1: Nhận biết</strong><small>Phát âm cơ bản & Nhận diện từ vựng Unit ${U}</small></span><em>25 phút</em></button>
      <button class="lvb" onclick="startTest(2)"><i>🌿</i><span><strong>Bài kiểm tra Mức 2: Thông hiểu</strong><small>Ngữ pháp trọng tâm, chia động từ & cấu trúc câu</small></span><em>30 phút</em></button>
      <button class="lvb" onclick="startTest(3)"><i>🌳</i><span><strong>Bài kiểm tra Mức 3: Vận dụng</strong><small>Đọc hiểu đoạn văn & Sắp xếp hoàn thành câu</small></span><em>35 phút</em></button>
      <button class="lvb" onclick="startTest(4)"><i>🏆</i><span><strong>Bài kiểm tra Mức 4: Vận dụng cao</strong><small>Tìm lỗi sai, Viết lại câu nâng cao & Tổng hợp</small></span><em>40 phút</em></button>
    </div>`;
}

function startTest(level) {
  const c = $("tcard");
  const testData = getTestData(level);
  c.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem;">
      <h3 style="margin:0">📝 Bài kiểm tra Mức ${level} (Unit ${U})</h3>
      <button class="tk" onclick="renderTestMenu()">⬅️ Quay lại</button>
    </div>
    <p style="font-size:.85rem; color:var(--mut); font-weight:700;">Đề thi bám sát định dạng cấu trúc đánh giá năng lực mới nhất. Hãy hoàn thành các câu hỏi dưới đây:</p>
    <form id="test-form">
      ${testData.map((sec, sidx) => `
        <div class="test-section">
          <h4>${sec.title}</h4>${sec.questions.map((q, qidx) => `
            <div class="t-q">
              <p><b>Câu ${sidx*3 + qidx + 1}:</b> ${q.q}</p>
              <div class="t-opts">
                ${q.opts.map((op, oid) => `
                  <label class="t-opt" style="display:block">
                    <input type="radio" name="q_${sidx}_${qidx}" value="${oid}" style="margin-right:.5rem"> ${op}
                  </label>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `).join("")}
      <button type="button" class="big b1" style="width:100%; margin-top:1rem;" onclick="submitTest(${level})">📤 Nộp bài & Chấm điểm</button>
    </form>
    <div id="test-result" style="margin-top:1rem; font-weight:800; text-align:center; font-size:1.1rem;"></div>
  `;
}

function getTestData(level) {
  // Tạo dữ liệu đề thi mô phỏng theo 4 mức độ bám sát Unit hiện tại
  const d = D[U-1];
  if(level === 1) {
    return [
      {
        title: "Phần 1: Ngữ âm & Từ vựng (Phonetics & Vocabulary)",
        questions: [
          { q: `Từ nào sau đây liên quan đến chủ đề "${d[0]}" (${d[1]})?`, opts: [`A. ${items(U)[0]?.w || "dolphin"}`, "B. Computer", "C. Television", "D. Bicycle"], ans: 0 },
          { q: "Chọn từ có cách phát âm hoặc trọng âm phù hợp nhất:", opts: ["A. favourite", "B. building", "C. country", "D. tất cả đều đúng"], ans: 3 }
        ]
      },
      {
        title: "Phần 2: Ngữ pháp cơ bản (Grammar Multiple Choice)",
        questions: [
          { q: "What ___ your name? - My name is Nam.", opts: ["A. am", "B. is", "C. are", "D. be"], ans: 1 },
          { q: "Where ___ you live? - I live in Bỉm Sơn.", opts: ["A. do", "B. does", "C. is", "D. are"], ans: 0 }
        ]
      }
    ];
  } else if(level === 2) {
    return [
      {
        title: "Phần 1: Cấu trúc câu & Giới từ (Grammar & Structures)",
        questions: [
          { q: "My house is ___ the countryside with a big garden.", opts: ["A. on", "B. in", "C. at", "D. under"], ans: 1 },
          { q: "How often do you listen ___ music? - Every evening.", opts: ["A. to", "B. for", "C. with", "D. at"], ans: 0 }
        ]
      },
      {
        title: "Phần 2: Chia động từ & Mẫu câu giao tiếp (Verb forms)",
        questions: [
          { q: "What would you like ___ in the future? - A pilot.", opts: ["A. be", "B. to be", "C. being", "D. been"], ans: 1 },
          { q: "We should ___ vegetables and fruit to stay healthy.", opts: ["A. eat", "B. eats", "C. eating", "D. ate"], ans: 0 }
        ]
      }
    ];
  } else if(level === 3) {
    return [
      {
        title: "Phần 1: Đọc hiểu điền từ (Reading Cloze Test)",
        questions: [
          { q: "Đọc đoạn văn về Unit và chọn từ đúng điền vào chỗ trống: 'I live in a ___ in Hanoi. It is on the fourth floor.'", opts: ["A. flat", "B. school", "C. park", "D. zoo"], ans: 0 },
          { q: "'What did you see at the zoo? - We saw many animals like monkeys and ___.'", opts: ["A. books", "B. tigers", "C. desks", "D. pens"], ans: 1 }
        ]
      },
      {
        title: "Phần 2: Sắp xếp câu hoàn chỉnh (Sentence Building)",
        questions: [
          { q: "Chọn câu được sắp xếp đúng từ các từ cho sẵn: [favourite / What / sport / is / your ?]", opts: ["A. What is your favourite sport?", "B. What favourite is your sport?", "C. Sport your favourite is what?"], ans: 0 },
          { q: "Chọn câu đồng nghĩa hoặc phản hồi chính xác:", opts: ["A. I like playing table tennis with my friends.", "B. I playing tennis.", "C. Table tennis play I."], ans: 0 }
        ]
      }
    ];
  } else {
    return [
      {
        title: "Phần 1: Tìm lỗi sai ngữ pháp (Error Identification)",
        questions: [
          { q: "Tìm lỗi sai trong câu sau: 'She like reading comics in her free time.'", opts: ["A. She -> He", "B. like -> likes", "C. comics -> comic", "D. free -> busy"], ans: 1 },
          { q: "Tìm lỗi sai trong câu sau: 'What are you going do this summer?'", opts: ["A. What -> Where", "B. are -> is", "C. going -> going to", "D. this -> that"], ans: 2 }
        ]
      },
      {
        title: "Phần 2: Viết lại câu nâng cao & Tổng hợp (Sentence Transformation)",
        questions: [
          { q: "Chọn câu viết lại tương đương với: 'My house has a big garden.'", opts: ["A. There is a big garden in my house.", "B. There are big garden in my house.", "C. My house is a big garden."], ans: 0 },
          { q: "Chọn đáp án đúng nhất tổng hợp chủ đề Unit:", opts: ["A. We should study hard and eat healthy food every day.", "B. We shouldn't healthy.", "C. We eating food."], ans: 0 }
        ]
      }
    ];
  }
}

function submitTest(level) {
  const form = $("test-form");
  const testData = getTestData(level);
  let score = 0, total = 0;
  testData.forEach((sec, sidx) => {
    sec.questions.forEach((q, qidx) => {
      total++;
      const radios = form.elements[`q_${sidx}_${qidx}`];
      if(radios) {
        let val = radios.value !== undefined && !radios.length ? (radios.checked ? radios.value : null) : null;
        if(radios.length) {
          for(let r of radios) { if(r.checked) val = r.value; }
        }
        if(val !== null && +val === q.ans) score++;
      }
    });
  });
  const pct = Math.round(score/total*100);
  $("test-result").innerHTML = `🎉 Bạn đạt ${score}/${total} câu đúng (${pct}%). ${pct >= 80 ? "🏆 Xuất sắc!" : pct >= 50 ? "👍 Khá tốt!" : "💪 Cố gắng ôn tập thêm nhé!"}`;
}

/* Điều hướng chế độ: 0: Thẻ học, 1: Luyện tập, 2: Ngữ pháp, 3: Kiểm tra */
function mode(){
  const m0 = $("card"), m1 = $("pcard"), m2 = $("gcard"), m3 = $("tcard"), tg = $("tg"), tabs = $("tabs");
  m0.style.display = M===0 ? "" : "none";
  m1.style.display = M===1 ? "" : "none";
  m2.style.display = M===2 ? "" : "none";
  m3.style.display = M===3 ? "" : "none";
  tg.style.display = M===0 ? "" : "none";
  tabs.style.display = M===0 ? "" : "none";
  if(M===0) show();
  else if(M===1) pstart();
  else if(M===2) renderGrammar();
  else if(M===3) renderTestMenu();
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",+b.dataset.m==M));
}
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{M=+b.dataset.m;mode()});

$("bl").onclick=listen;$("bs").onclick=speak;$("bp").onclick=()=>step(-1);$("bn").onclick=()=>step(1);$("know").onclick=know;$("ba").onclick=add;$("bk").onclick=check;
$("bx").onclick=()=>{$("lock").style.display="none";pend=0};
$("tg").onclick=()=>{const t=$("teach");t.style.display=t.style.display==="block"?"none":"block"};
$("pw").onkeydown=e=>{if(e.key==="Enter")check()};

load();
</script>
